services:
  mock-bmk-it:
    build:
      context: .
      dockerfile: dev_tools/mock_bmk_it/Dockerfile
    container_name: hr-module-mock-bmk-it
    ports:
      - "8088:8088"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Бот на хосте; из контейнера localhost — это сам контейнер, не Mac/Windows
      MIDDLEWARE_HOST: http://host.docker.internal:${PORT:-8091}
      MOCK_PUBLIC_URL: http://127.0.0.1:8088
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
