analyze_messages:
  description: >
    Проанализируй список сообщений {messages}. Определи, какие темы
    обсуждаются, кто участвует и что именно говорил каждый участник по
    каждой теме. Сформируй итоги по темам. Участники чата {participants}
  expected_output: |
    Верни JSON, совместимый с pydantic-моделью Topics:
    {
      "topics": [
        {
          "topic": "<краткое название темы>",
          "category": "<категория: frontend | backend | infrastructure | qa | product | other>",
          "summary": "<1-2 предложения суть обсуждения>",
          "participants_with_comments": {
            "строка <user_id> - <name>": [
              "<кратко, что сказал пользователь по теме>",
              "... при необходимости несколько пунктов"
            ]
          },
          "resolution": "<как решили / договорились, если есть, иначе null>",
          "text_for_task": "<текст для задачи в Jira: без user_id, формальный стиль, описание проблемы и требуемых действий>"
        }
      ]
    }

    Правила:
    - ВАЖНО - НЕ УЧИТЫВАЙ темы которые не имеют отношения к формальной работе (например: шутки, субъективные мнения, неформальные разговоры)
    - text_for_task должен быть написан в формальном стиле для Jira, без упоминания user_id.
    - Не выдумывай факты и имена; используй только данные из сообщений.
    - Объединяй сообщения в темы по смыслу; не создавай лишних тем.
    - summary должно быть лаконичным и точным; без воды.
    - participants_with_comments содержит только участников, реально говоривших по теме.
    - Если решения нет, ставь resolution=null.
  agent: topic_analyze_agent
