task_summary:
  description: >
    Проанализируй транскрибированный текст {text}. Определи заголовок задачи и её описание
  expected_output: |
    Верни JSON, совместимый с pydantic-моделью TaskSummary:
    {
      "header": Краткий и чёткий заголовок задачи.
      "content": Точное описание задачи, без излишеств, написанное формальным языком.
    }

    Правила для заголовка (header):
    - Длина 3-8 слов, краткий и ёмкий
    - Начинается с глагола в неопределённой форме (создать, исправить, добавить, оптимизировать, настроить)
    - Без слов-паразитов из транскрипции (ну, вот, типа, как бы, короче)
    - Без точки в конце
    - Первое слово с заглавной буквы
    
    Правила для описания (content):
    - Убрать все слова-паразиты, повторы и мусор из транскрипции
    - Переформулировать в формальный стиль
    - Структурировать текст если есть несколько пунктов
    - Сохранить все важные детали (технические требования, дедлайны, контекст)
    - Писать полными предложениями с правильной пунктуацией
    - Если в голосовом есть вопросы - превратить в утверждения о необходимых действиях
    
    Правила обработки транскрипции:
    - Исправить очевидные ошибки распознавания речи
    - Расшифровать сокращения если это возможно по контексту
    - Игнорировать вводные фразы типа "слушай", "короче", "в общем", "значит"
  agent: task_summary_agent
