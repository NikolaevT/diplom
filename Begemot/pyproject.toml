[project]
name = "chatbot-begemot"
version = "1.0.0"
description = "Telegram-бот Бегемот: дни рождения, вишлисты, адаптация"
authors = [
    {name = "BMK Team"}
]
requires-python = "==3.12.*"
dependencies = [
    "aiogram>=3.9.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<0.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
